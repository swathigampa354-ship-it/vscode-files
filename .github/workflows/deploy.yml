name: Build and Test VS Code Server

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      
      - name: Build Docker image
        run: docker build -t vscode-server .
      
      - name: Test Docker image
        run: |
          docker run -d -p 8080:8080 --name vscode-test vscode-server
          sleep 10
          curl -f http://localhost:8080 || exit 1
          docker stop vscode-test

  build-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Render Dockerfile
        run: docker build -f Dockerfile.render -t vscode-server-render .

  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate JSON configs
        run: |
          cat .vscode/settings.json | python3 -m json.tool
          cat .vscode/extensions.json | python3 -m json.tool
          cat .vscode/keybindings.json | python3 -m json.tool
          cat .vscode/claude-code.json | python3 -m json.tool
          cat .vscode/kickbacks.json | python3 -m json.tool
