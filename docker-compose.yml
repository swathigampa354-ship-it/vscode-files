version: '3.8'

services:
  code-server:
    build: .
    container_name: vscode-server
    ports:
      - "8080:8080"
    volumes:
      - ./workspace:/config/workspace
      - ./user-settings:/config/user/settings
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      - PASSWORD=
      - SUDO_PASSWORD=
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
